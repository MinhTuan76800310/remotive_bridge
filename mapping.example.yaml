remotive:
  # 50051 is correct for THIS rig (bridge/vss-vcar) and for nothing else.
  #
  # A vCar built by kx360v does NOT publish 50051: its port is allocated from
  # GRPC_PORT_BASE = 50100 upward and changes on every rebuild. Pointing this
  # line at 50051 there gives `Connection refused (111)`, which reads like a
  # broken bridge and is only a wrong number. For one of those, generate the
  # mapping against the live vehicle instead of copying this file — the script
  # reads the real port AND the real signal names, so neither can be guessed
  # wrong:
  #
  #     ./scripts/discover_mapping.py > my-vehicle.yaml
  #
  # From a container on the vCar network, use the service name and the
  # container-side port: http://topology-broker.com:50051 — the host-published
  # port is bound to 127.0.0.1 and no container can reach it.
  url: http://127.0.0.1:50051

kuksa:
  host: 127.0.0.1
  port: 55555

options:
  seed_seconds: 3      # how long to read cyclically before switching to on-change
  retry_delay: 10      # backoff between reconnect attempts, both peers
  health_host: 0.0.0.0
  health_port: 8090 # remotive [CAN namespace] <--> VSS 

to_vss:
  - can: {namespace: BCM-VehicleCAN, signal: VSS_VehicleState.Vehicle_LowVoltageSystemState}
    vss: Vehicle.LowVoltageSystemState
    type: string
    transform:
      op: enum
      map: {0: UNDEFINED, 1: LOCK, 2: "OFF", 3: ACC, 4: "ON", 5: START}

  - can: {namespace: BCM-VehicleCAN, signal: VSS_VehicleState.Vehicle_Cabin_ChildPresence_IsDetected}
    vss: Vehicle.Cabin.ChildPresence.IsDetected
    type: string
    transform:
      op: enum
      map: {0: NOT_DETECTED, 1: DETECTED}

  - can: {namespace: BCM-VehicleCAN, signal: VSS_VehicleState.Vehicle_Body_Horn_IsActive}
    vss: Vehicle.Body.Horn.IsActive
    type: boolean
    transform: {op: threshold, gt: 0}

  - can: {namespace: BCM-VehicleCAN, signal: VSS_VehicleState.Vehicle_Body_Lights_Hazard_IsSignaling}
    vss: Vehicle.Body.Lights.Hazard.IsSignaling
    type: boolean
    transform: {op: threshold, gt: 0}

to_can:
  - vss: Vehicle.Cabin.HMI.TelltaleId
    can: {namespace: BCM-VehicleCAN, signal: VC_To_HMI.TelltaleId}
    type: int
    range: {min: 0, max: 255}
    allow_add: true

  - vss: Vehicle.Cabin.HMI.ChimeId
    can: {namespace: BCM-VehicleCAN, signal: VC_To_HMI.ChimeId}
    type: int
    range: {min: 0, max: 255}
    allow_add: true
